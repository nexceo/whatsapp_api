# whatsapp_api - Evolution API Standalone Production Deployment
#
# Runs the published evoapicloud/evolution-api image (no application
# source is vendored in this repo). Pin the image tag below when
# upgrading -- see scripts/update.sh and docs/EVOLUTION_DEPLOYMENT.md.
#
# Fully isolated from any other stack on this host (e.g. nexceo-crm):
# dedicated network, dedicated volumes, dedicated Postgres, dedicated Redis.
# No service in this file shares a network, volume, or container with any
# other project.
#
# Usage:
#   docker compose -p evolution -f docker-compose.production.yml --env-file .env.production up -d
#   docker compose -p evolution -f docker-compose.production.yml --env-file .env.production ps
#   docker compose -p evolution -f docker-compose.production.yml --env-file .env.production logs -f

services:
  evolution-postgres:
    container_name: evolution-postgres
    image: postgres:15
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=300
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-network
    # Intentionally NOT published to the host. Only reachable from
    # containers on evolution-network. Avoids any port collision with
    # the CRM's postgres (already bound to host 5432).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  evolution-redis:
    container_name: evolution-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolution-network
    # Intentionally NOT published to the host. Avoids any collision with
    # the CRM's redis (already bound to host 6379).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  evolution-api:
    container_name: evolution-api
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      # Bound to localhost only: no public nginx vhost/HTTPS configured yet
      # for this service. Change to 0.0.0.0 (or better, keep localhost-only
      # and front it with an nginx server block + TLS) once a domain is set.
      - "127.0.0.1:${SERVER_PORT}:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  evolution-manager:
    container_name: evolution-manager
    image: evoapicloud/evolution-manager:latest
    restart: unless-stopped
    depends_on:
      - evolution-api
    ports:
      # Bound to localhost only, same reasoning as evolution-api.
      - "127.0.0.1:${MANAGER_PORT}:80"
    volumes:
      # Vendor image ships a broken nginx.conf (invalid gzip_proxied
      # value "must-revalidate"), which crash-loops the container. See
      # Docker/production/evolution-manager-nginx.conf for details.
      - ./Docker/production/evolution-manager-nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
    networks:
      - evolution-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  evolution_postgres_data:
    name: evolution_postgres_data
  evolution_redis_data:
    name: evolution_redis_data
  evolution_instances:
    name: evolution_instances

networks:
  evolution-network:
    name: evolution-network
    driver: bridge
